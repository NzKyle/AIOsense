substitutions:
  buzzer_pin: A0
  i2s_bclk_pin: A1
  i2s_din_pin: "${buzzer_pin}"
  i2s_lrclk_pin: A5
  pir_pin: A4
  rgb_led_pin: GPIO7
  rgb_led_type: GRB
  sen0395_io_pin: A2
  #uart_rx_pin: GPIO20
  #uart_tx_pin: GPIO21

external_components:
  - source: github://esphome/esphome@2026.2.2
    components: [uart]
#  - source: github://esphome/esphome@2025.8.1
#    components: [i2c]

esphome:
 platformio_options:
    board_build.flash_mode: dio

esp32:
  board: lolin_c3_mini
  framework:
    type: esp-idf
    #version: 5.4.2
    
    
#uart:
#  tx_pin: "${uart_tx_pin}"
#  rx_pin: "${uart_rx_pin}"
#  baud_rate: 256000
#  parity: NONE
#  stop_bits: 1
    
wifi:
  output_power: 8.5dBm

i2c:
  sda: GPIO8
  scl: GPIO10

sensor:
  - platform: internal_temperature
    name: "CPU Temperature"
